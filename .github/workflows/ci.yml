name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for the .beads/ guard's diff against origin/main

      - name: Guard - PR must not touch .beads/
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep '^\.beads/'; then
            echo "::error::PR branches must not modify .beads/ (beads metadata is committed only via chore(beads) commits on main)"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # npm ci (root) の所要時間が run ごとに 4s〜422s まで振れる不安定さが実測されている
      # (bdboard-gofm。verify/e2e 各10run・40点を計測)。setup-node の npm パッケージ
      # キャッシュは 20/20 run でヒットしているにもかかわらずこの振れ幅が消えないため、
      # キャッシュのヒット/ミスでは説明がつかない (レジストリ/ネットワーク側の変動、
      # または better-sqlite3 が prebuild-install 経由で行うネイティブバイナリ取得が
      # 疑わしいが、既存ログの粒度では確定できない)。node_modules 自体をキャッシュし、
      # lockfile 未変更時は npm ci をスキップすることで、原因を特定しないままこの層の
      # 変動ごと迂回する。install 時スクリプトは prepack のみで、これは npm pack/publish
      # でしか走らないため、スキップしても未実行のまま残る副作用は無い (確認済み)。
      #
      # キーに runner.arch と ImageOS を含めるのは、node_modules が better-sqlite3 の
      # **ネイティブバイナリ** を抱えているため。setup-node 内蔵のキャッシュが安全なのは
      # tarball しか持たないからで、ビルド済み成果物をキャッシュするこちらは同じ前提に
      # 乗れない。ubuntu-latest が 22.04 から 24.04 へ移った瞬間に、別の glibc 向けの
      # .node を復元して不可解に落ちる — それを防ぐために実行環境の同一性まで鍵に含める。
      # ImageOS が空になる環境 (self-hosted 等) では鍵の1区画が消えるだけで、
      # 従来の粒度に劣化するだけで壊れはしない。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: web-node-modules-cache
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-node-modules-cache.outputs.cache-hit != 'true'
        run: npm --prefix web ci

      - run: npm run verify

  # Kept separate from `verify` rather than using a matrix so the existing
  # check name `verify` stays unchanged — our merge convention waits on that
  # name, and we do not want to break a future required Windows gate either.
  verify-windows:
    # 落ちても PR をブロックしないよう job 全体を continue-on-error にしている。
    # state は unstable になるだけで、マージは可能。
    #
    # このジョブを必須ゲートにするかどうかの判断は bdboard-51qb が持つ。
    # (以前ここは bdboard-70z.9 を指していたが、70z.9 は「Windows 未対応機能を
    #  UI で明示する」という別件で、しかも既に closed。判断の持ち主が消えていた。)
    #
    # 現況 (実測 2026-09-04): このジョブを入れた当初の前提だった
    # 「Windows で test:server が 65 件落ちる」(bdboard-9dm) は解消済みで、
    # 9dm も closed。直近の main / PR の run では verify-windows は概ね success。
    # 残っている赤は bdboard-pqhe の flake (scripts/check-drift.test.mjs が
    # Windows の遅いプロセス生成で per-test 5s を超える) 1系統のみ。
    # つまり必須化を妨げている具体的な要因は pqhe だけまで絞れている。
    #
    # なぜ今このPRで必須化しないか: pqhe が未 land の状態で必須にすると、
    # 既知の flake がそのまま全PRのマージブロッカーになる。必須化の発火条件は
    # bdboard-51qb 側に書いてある。
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # ubuntu 側 (verify job) と同じ npm ci 所要時間の不安定さ対策。詳細は verify
      # job のコメント参照 (bdboard-gofm)。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: web-node-modules-cache
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('web/package-lock.json') }}
      - if: steps.web-node-modules-cache.outputs.cache-hit != 'true'
        run: npm --prefix web ci
      # bdboard-2yp で scripts/verify.mjs が Windows 対応になったので、ubuntu 側と
      # 同じ 1 行に戻した (bdboard-pax)。以前はステップ列として複製していたが、
      # verify のチェーンが変わるたびに手で追随が要る二重管理になっていた。
      # verify:steps は直列 (build && build:web && test:server && test:web &&
      # check:boundaries) なので、test:server で止まると後続は走らない。
      # 個々の落ち方の内訳は bdboard-9dm に記録済み。
      - run: npm run verify
  e2e:
    runs-on: ubuntu-latest
    # verify と同じ 15 分。ジョブ時間の支配要因は npm install で、同じコマンドが
    # run ごとに 4s〜421s まで振れる (実測 2026-09-04, bdboard-ey35)。テスト本体
    # (build:web + playwright) は毎回 17 秒、Playwright のブラウザキャッシュも
    # 3〜4 秒でヒットしており、install 以外に削れる余地は無い。10 分だと install が
    # 遅い回にそのまま cancelled になるため、同じ変動を抱えたまま運用できている
    # verify に揃える。テスト本体が 17 秒である以上、15 分でも本物のハングは十分
    # 早く検知できる。install 時間の不安定さ自体への対策 (node_modules キャッシュ)
    # は bdboard-gofm で下の npm ci ステップに追加済み。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # verify job と同じ npm ci 所要時間の不安定さ対策。詳細は verify job の
      # コメント参照 (bdboard-gofm)。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: web-node-modules-cache
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-node-modules-cache.outputs.cache-hit != 'true'
        run: npm --prefix web ci

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # chromium only (not `npx playwright install --with-deps` with no
      # browser argument, which would fetch all of Chromium/Firefox/WebKit):
      # the smoke suite only ever launches Chromium, so the other browsers
      # would only waste CI time and cache space.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # --with-deps only installs browser binaries on a cache hit, not the OS
      # package dependencies (libnss3 etc.) chromium needs to actually launch.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # BDBOARD_E2E_PORT を pin しない — 自動採番と config→worker への env 伝播を CI でも必ず通す。
      # pin すると本番経路 (playwright.config.ts の書き戻し) が一度も検証されず、壊れても CI が緑のままになる。
      - run: npm run test:e2e

  # release-please が作る release PR には pull_request トリガーの ci が走らない
  # (GITHUB_TOKEN 仕様 — release-please.yml 先頭コメント参照)。squash 後の最終メッセージも
  # PR 時点では未確定なので pull_request では検査しない。main push 時に v<last>..HEAD を
  # 見ればタグを切る前に間に合う。concurrency で前 run がキャンセルされても範囲全体を
  # 見るので後続 run が取りこぼしを拾い直せる。
  commit-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # main への push: 直近のリリースタグ以降を全部見る (既定の範囲)。
      # ここが最終的な砦で、タグを切る前に取りこぼしが無いことを保証する。
      - if: github.event_name == 'push'
        run: npm run check:commits

      # PR: そのPRが足すコミットだけを見る (bdboard-qhsb)。
      #
      # なぜ PR でも見る必要があるのか: GitHub の squash マージは、コミットが1件なら
      # **そのコミットのメッセージをそのまま** squash メッセージにする。このリポジトリは
      # 1PR=1コミットが常態なので、main に載るメッセージはマージ前からブランチ上に実在する。
      # つまり PR 時点で検査できる。push だけで見ていた頃は、#260 のように壊れた
      # メッセージがマージされて初めて main が赤くなり、その時点では履歴書き換えか
      # CHANGELOG 手追記しか復旧手段が無かった (bdboard-ym9r)。
      #
      # なぜ既定の範囲を使わないのか: 既定は `v<直近リリース>..HEAD` で、main 上の
      # 既存コミットまで巻き込む。main に未解決の解析不能コミットが1件でもあると、
      # 無関係な PR が全部赤くなって道連れになる。PR が足した分だけを見る。
      #
      # 終端に HEAD ではなく head.sha を使う理由: pull_request の HEAD は GitHub が
      # 生成したマージ ref (refs/pull/N/merge) で、base の *現在の* 先端に対して作られる。
      # イベント発火からチェックアウトまでの間に main が動くと、base.sha..HEAD に
      # 無関係な main のコミットが紛れ込み、避けたかった道連れがそのまま起きる。
      # base.sha..head.sha なら main がどう動いてもこの PR のコミットだけになる。
      #
      # なお範囲にマージコミット ("Merge X into Y") が入ること自体は許容できる。
      # ブランチが main を merge で取り込んでいれば普通に混ざるが、conventional な
      # type を持たないので CHANGELOG 対象外に分類され warning 止まり (実測 2026-09-04)。
      # この前提は scripts/check-commit-parse.test.mjs で固定してある。
      - if: github.event_name == 'pull_request'
        run: |
          npm run check:commits -- --range \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
