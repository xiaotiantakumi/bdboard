name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for the .beads/ guard's diff against origin/main

      - name: Guard - PR must not touch .beads/
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep '^\.beads/'; then
            echo "::error::PR branches must not modify .beads/ (beads metadata is committed only via chore(beads) commits on main)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run verify

  # Kept separate from `verify` rather than using a matrix so the existing
  # check name does not change. `continue-on-error` keeps this advisory while
  # bdboard-70z.8 records current Windows failures; bdboard-70z.9 will decide
  # when it can become required.
  verify-windows:
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run verify

  # Kept separate from `verify` on purpose (bdboard-3tw.88): a real browser +
  # server boot is a different failure class than tsc/vitest/depcruise, and a
  # flaky e2e run must not muddy the unit-test job's log or block on tsc/lint
  # results that already passed. Real bd is never installed here — see
  # test/e2e/fixtures/bin/bd — so this job stays fast and needs no extra
  # system setup beyond the Playwright browser itself.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci
      - run: npm --prefix web ci

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # chromium only (not `npx playwright install --with-deps` with no
      # browser argument, which would fetch all of Chromium/Firefox/WebKit):
      # the smoke suite only ever launches Chromium, so the other browsers
      # would only waste CI time and cache space.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # --with-deps only installs browser binaries on a cache hit, not the OS
      # package dependencies (libnss3 etc.) chromium needs to actually launch.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e
        env:
          BDBOARD_E2E_PORT: '8799'
