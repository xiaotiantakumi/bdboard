name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR では同じブランチの古い run を捨てる。main への push は sha ごとに別グループにして、
# 連続した auto-merge の run が互いにキャンセルされて赤が見えなくなるのを防ぐ (bdboard-1e2l)。
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # bdboard-41rp: 旧 Node テストを skip させない。下の export ステップが消える・空になると
    # BDBOARD_OLD_NODE 未設定で黙って skip に戻るので、job 単位のこのフラグでテスト側を落とす。
    env:
      BDBOARD_OLD_NODE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for the .beads/ guard's diff against origin/main

      - name: Guard - PR must not touch .beads/
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep '^\.beads/'; then
            echo "::error::PR branches must not add or modify .beads/ - this repo does not track .beads/ in git (see .gitignore)"
            exit 1
          fi

      # bdboard-41rp: エージェント shell で実測した旧 Node 14.15.0 (bdboard-eu2k) を入れ、その
      # パスを export する。下の Node 22 setup-node が 22 の bin を PATH 先頭に足す (14 の bin は
      # 後方に残る) ため以降は 22 のまま。test:server の旧 Node テスト
      # (scripts/node-version-guard.old-node.test.mjs) だけが BDBOARD_OLD_NODE を使う。
      # ubuntu 限定 (CI は ubuntu のみ。Windows 非対応、bdboard-l1kt)。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 14.15.0
          package-manager-cache: false
      - name: Export old Node path for the version-guard test
        run: |
          set -euo pipefail
          old_node="$(command -v node)"
          test -x "$old_node"
          "$old_node" --version
          echo "BDBOARD_OLD_NODE=$old_node" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # npm ci (root) の所要時間が run ごとに 4s〜422s まで振れる不安定さが実測されている
      # (bdboard-gofm。verify/e2e 各10run・40点を計測)。setup-node の npm パッケージ
      # キャッシュは 20/20 run でヒットしているにもかかわらずこの振れ幅が消えないため、
      # キャッシュのヒット/ミスでは説明がつかない (レジストリ/ネットワーク側の変動、
      # または better-sqlite3 が prebuild-install 経由で行うネイティブバイナリ取得が
      # 疑わしいが、既存ログの粒度では確定できない)。node_modules 自体をキャッシュし、
      # lockfile 未変更時は npm ci をスキップすることで、原因を特定しないままこの層の
      # 変動ごと迂回する。install 時スクリプトは prepack のみで、これは npm pack/publish
      # でしか走らないため、スキップしても未実行のまま残る副作用は無い (確認済み)。
      #
      # キーに runner.arch と ImageOS を含めるのは、node_modules が better-sqlite3 の
      # **ネイティブバイナリ** を抱えているため。setup-node 内蔵のキャッシュが安全なのは
      # tarball しか持たないからで、ビルド済み成果物をキャッシュするこちらは同じ前提に
      # 乗れない。ubuntu-latest が 22.04 から 24.04 へ移った瞬間に、別の glibc 向けの
      # .node を復元して不可解に落ちる — それを防ぐために実行環境の同一性まで鍵に含める。
      # ImageOS が空になる環境 (self-hosted 等) では鍵の1区画が消えるだけで、
      # 従来の粒度に劣化するだけで壊れはしない。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: web-node-modules-cache
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-node-modules-cache.outputs.cache-hit != 'true'
        run: npm --prefix web ci

      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    # verify と同じ 15 分。ジョブ時間の支配要因は npm install で、同じコマンドが
    # run ごとに 4s〜421s まで振れる (実測 2026-09-04, bdboard-ey35)。テスト本体
    # (build:web + playwright) は毎回 17 秒、Playwright のブラウザキャッシュも
    # 3〜4 秒でヒットしており、install 以外に削れる余地は無い。10 分だと install が
    # 遅い回にそのまま cancelled になるため、同じ変動を抱えたまま運用できている
    # verify に揃える。テスト本体が 17 秒である以上、15 分でも本物のハングは十分
    # 早く検知できる。install 時間の不安定さ自体への対策 (node_modules キャッシュ)
    # は bdboard-gofm で下の npm ci ステップに追加済み。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # verify job と同じ npm ci 所要時間の不安定さ対策。詳細は verify job の
      # コメント参照 (bdboard-gofm)。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: web-node-modules-cache
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-node22-${{ hashFiles('web/package-lock.json') }}

      - if: steps.web-node-modules-cache.outputs.cache-hit != 'true'
        run: npm --prefix web ci

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # chromium only (not `npx playwright install --with-deps` with no
      # browser argument, which would fetch all of Chromium/Firefox/WebKit):
      # the smoke suite only ever launches Chromium, so the other browsers
      # would only waste CI time and cache space.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # --with-deps only installs browser binaries on a cache hit, not the OS
      # package dependencies (libnss3 etc.) chromium needs to actually launch.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # BDBOARD_E2E_PORT を pin しない — 自動採番と config→worker への env 伝播を CI でも必ず通す。
      # pin すると本番経路 (playwright.config.ts の書き戻し) が一度も検証されず、壊れても CI が緑のままになる。
      - run: npm run test:e2e
