name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for the .beads/ guard's diff against origin/main

      - name: Guard - PR must not touch .beads/
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep '^\.beads/'; then
            echo "::error::PR branches must not modify .beads/ (beads metadata is committed only via chore(beads) commits on main)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run verify

  # Kept separate from `verify` rather than using a matrix so the existing
  # check name `verify` stays unchanged — our merge convention waits on that
  # name, and we do not want to break a future required Windows gate either.
  verify-windows:
    # 落ちても PR をブロックしないよう job 全体を continue-on-error にしている。
    # state は unstable になるだけで、マージは可能。
    #
    # このジョブを必須ゲートにするかどうかの判断は bdboard-51qb が持つ。
    # (以前ここは bdboard-70z.9 を指していたが、70z.9 は「Windows 未対応機能を
    #  UI で明示する」という別件で、しかも既に closed。判断の持ち主が消えていた。)
    #
    # 現況 (実測 2026-09-04): このジョブを入れた当初の前提だった
    # 「Windows で test:server が 65 件落ちる」(bdboard-9dm) は解消済みで、
    # 9dm も closed。直近の main / PR の run では verify-windows は概ね success。
    # 残っている赤は bdboard-pqhe の flake (scripts/check-drift.test.mjs が
    # Windows の遅いプロセス生成で per-test 5s を超える) 1系統のみ。
    # つまり必須化を妨げている具体的な要因は pqhe だけまで絞れている。
    #
    # なぜ今このPRで必須化しないか: pqhe が未 land の状態で必須にすると、
    # 既知の flake がそのまま全PRのマージブロッカーになる。必須化の発火条件は
    # bdboard-51qb 側に書いてある。
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      # bdboard-2yp で scripts/verify.mjs が Windows 対応になったので、ubuntu 側と
      # 同じ 1 行に戻した (bdboard-pax)。以前はステップ列として複製していたが、
      # verify のチェーンが変わるたびに手で追随が要る二重管理になっていた。
      # verify:steps は直列 (build && build:web && test:server && test:web &&
      # check:boundaries) なので、test:server で止まると後続は走らない。
      # 個々の落ち方の内訳は bdboard-9dm に記録済み。
      - run: npm run verify
  e2e:
    runs-on: ubuntu-latest
    # verify と同じ 15 分。ジョブ時間の支配要因は npm install で、同じコマンドが
    # run ごとに 4s〜421s まで振れる (実測 2026-09-04, bdboard-ey35)。テスト本体
    # (build:web + playwright) は毎回 17 秒、Playwright のブラウザキャッシュも
    # 3〜4 秒でヒットしており、install 以外に削れる余地は無い。10 分だと install が
    # 遅い回にそのまま cancelled になるため、同じ変動を抱えたまま運用できている
    # verify に揃える。テスト本体が 17 秒である以上、15 分でも本物のハングは十分
    # 早く検知できる。install 時間の不安定さ自体は別チケットで追う。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci
      - run: npm --prefix web ci

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # chromium only (not `npx playwright install --with-deps` with no
      # browser argument, which would fetch all of Chromium/Firefox/WebKit):
      # the smoke suite only ever launches Chromium, so the other browsers
      # would only waste CI time and cache space.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # --with-deps only installs browser binaries on a cache hit, not the OS
      # package dependencies (libnss3 etc.) chromium needs to actually launch.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e
        env:
          BDBOARD_E2E_PORT: '8799'

  # release-please が作る release PR には pull_request トリガーの ci が走らない
  # (GITHUB_TOKEN 仕様 — release-please.yml 先頭コメント参照)。squash 後の最終メッセージも
  # PR 時点では未確定なので pull_request では検査しない。main push 時に v<last>..HEAD を
  # 見ればタグを切る前に間に合う。concurrency で前 run がキャンセルされても範囲全体を
  # 見るので後続 run が取りこぼしを拾い直せる。
  commit-parse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run check:commits
