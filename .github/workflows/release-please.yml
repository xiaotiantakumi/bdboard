name: release-please

on:
  push:
    branches: [main]

# GITHUB_TOKEN 起因のイベントは新しいワークフロー実行を起こさない、という GitHub の仕様がある。
# 帰結が2つある:
#   1. release-please が作る release PR には pull_request トリガーの ci.yml が走らない。
#      検証したいなら人間が close -> reopen するか手動 push する。
#   2. release-please が作るタグ / Release も、on: push: tags や on: release の
#      ワークフローを起動しない。publish (bdboard-70z.4) を素朴に tag トリガーで書くと
#      無音で何も起きない。同一ワークフロー内で action の outputs
#      (root component の release_created / tag_name) を使って publish ジョブを連結するか、PAT を使うこと。

# upstream の release-please-action README が要求する3点セット。issues: write は
# autorelease ラベルの付替え (pending -> tagged) とリリースコメント投稿に要る。
permissions:
  contents: write
  issues: write
  pull-requests: write

# main への push は squash マージ以外にも chore(beads) 直コミット等で重なりうる。
# release-please のリリース処理は Release 作成 -> ラベル付替え の多段 API 呼び出しなので、
# 途中でキャンセルされると「Release は作られたがラベルが autorelease: pending のまま」という
# 中途半端な状態になる (次回 run が DuplicateReleaseError を検知して自己修復はするが、
# その回は red になる)。無駄な失敗を避けるため後続実行を待たせる。
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # initial-version は初回リリース後は manifest に反映されるため、以降は config から削除してよい。
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please の本文は CHANGELOG 由来なので、起動時に照合する bd の版もここで追記する。
      # リリースタグを checkout して、公開対象ソース自身の EXPECTED_BD_VERSION から値を読む。
      - name: Checkout released tag for compatibility metadata
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Record bd CLI compatibility in GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          bd_version="$(sed -nE "s/^export const EXPECTED_BD_VERSION = '([^']+)';$/\1/p" src/domain/bd-version-check.ts)"
          if [[ -z "$bd_version" ]]; then
            echo "::error::EXPECTED_BD_VERSION could not be read from the released source."
            exit 1
          fi

          printf '%s\n\n## Compatibility\n\nTested with `bd` CLI v%s (the version checked at startup).\n' \
            "$RELEASE_BODY" "$bd_version" |
            gh release edit "$TAG_NAME" --notes-file -

  npm-publish:
    needs: release-please
    if: >-
      ${{ needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents は checkout にしか使わない (Release 本文の更新は release-please job の責務)。
    # id-token: write は trusted publishing (OIDC) の認証そのものに必須 (bdboard-cdqb)。
    # これを外すと npm CLI が OIDC を使えず、NODE_AUTH_TOKEN も渡していないので publish が
    # 認証エラーで落ちる。--provenance の署名用ではないので、フラグが無いことを理由に
    # 消さないこと (もともとは bdboard-d7n4 で --provenance のために足したもので、
    # trusted publishing への移行後は認証側が要求している)。
    permissions:
      contents: read
      id-token: write
    steps:
      # main の push 時点の SHA ではなく、release-please が作成したタグそのものを検証・pack する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
          registry-url: https://registry.npmjs.org

      # trusted publishing (OIDC) の要件は npm CLI >= 11.5.1 / Node >= 22.14.0。
      # 上の node-version: 22 が同梱する npm は 10.9.x 系なので、明示的に上げないと
      # OIDC が使われず publish が認証エラーになる。
      # npm@latest を使わない理由: latest は既に 12 系で、npm 12 は install 時の
      # ライフサイクルスクリプトを既定で無効化する (allowScripts off)。better-sqlite3 の
      # prebuild-install が走らずネイティブバイナリが用意されないため、verify が壊れる。
      # npm 12 への追従は別途扱う (bdboard-cdqb の「別チケットに切り出す論点」)。
      - name: Upgrade npm CLI for trusted publishing
        run: npm install -g npm@11

      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run verify
      # web/dist は npm 同梱物なので、prepack にも依存せず明示的にビルドする。
      - run: npm run build:web

      # 本番 publish。認証は npmjs.com 側に登録した trusted publisher による OIDC
      # (Publisher=GitHub Actions / xiaotiantakumi/bdboard / release-please.yml)。
      # npm CLI は OIDC 環境を自動検出してトークンより優先するので、NODE_AUTH_TOKEN は渡さない
      # (長命トークンを置かないこと自体がこの移行の目的 — bdboard-cdqb)。
      # --provenance も付けない: trusted publishing では provenance が自動生成・自動添付される。
      # --access public はスコープ無しパッケージでは既定だが、意図を明示するため残す。
      - name: Publish to npm
        run: npm publish --access public
